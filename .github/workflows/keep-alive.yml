name: Keep Frontend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual execution from the Actions tab

jobs:
  ping-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Waking up Frontend App
        continue-on-error: true
        run: |
          echo "Sending ping to Frontend URL..."
          curl -sL https://maio.maioli.dev.br/ > /dev/null
          echo "Ping sent successfully."
